name: Nasadenie na hotfolk.sk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nahratie cez FTP na WebSupport
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          log-level: verbose
          local-dir: ./site/
          server-dir: /hotfolk.sk/web/
          # mazať sa budú len súbory, ktoré nahrala táto automatika – _stary_wp a iné ostanú
          exclude: |
            **/.git*
            **/.git*/**
            _stary_wp/**
