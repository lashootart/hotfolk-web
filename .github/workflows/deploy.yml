name: Nasadenie na hotfolk.sk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inštalácia lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Nahratie cez SFTP na WebSupport
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # nahráva len zmenené súbory; na serveri nič nemaže (_stary_wp a iné ostanú)
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --only-newer --parallel=4 --verbose \
              --exclude-glob .git* --exclude-glob _stary_wp/ \
              ./site/ /hotfolk.sk/web/;
            bye"
